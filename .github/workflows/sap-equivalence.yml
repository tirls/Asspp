name: Native signed authentication diagnostic

on:
  push:
    branches: [codex/native-sap-equivalence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare verified interpreter and TLS libraries
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          export DERIVED_FILE_DIR="$RUNNER_TEMP/AuthProbe" SRCROOT="$PWD"
          export TARGET_BUILD_DIR="$RUNNER_TEMP/AuthProbe" UNLOCALIZED_RESOURCES_FOLDER_PATH=Resources
          export PLATFORM_NAME=macosx ARCHS="$(uname -m)" MACOSX_DEPLOYMENT_TARGET=15.0
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          /usr/bin/python3 Resources/Scripts/prepare.sap.py
          /usr/bin/python3 Resources/Scripts/prepare.curl.py
      - name: Send one signed synthetic login without real credentials
        run: |
          set -euo pipefail
          probe_root="$RUNNER_TEMP/AuthProbe"
          xcrun clang -fobjc-arc -c Asspp/Backend/AppStore/CurlAuthenticationClient.m \
            -I "$probe_root/AuthenticationCurl/include" -o "$probe_root/transport.o"
          xcrun clang++ -std=c++20 -O2 -fobjc-arc -framework Foundation -framework SystemConfiguration -lz \
            -I Asspp/Backend/AppStore -I Asspp/Backend/AppStore/SAP -I "$probe_root/SAP/source/include" \
            Resources/Tests/AuthServiceProbe.mm Asspp/Backend/AppStore/SAP/SAPContext.mm \
            Asspp/Backend/AppStore/SAP/SapMachine.cpp Asspp/Backend/AppStore/SAP/MachImage.cpp \
            "$probe_root/transport.o" "$probe_root/SAP/lib/libunicorn.a" \
            -L "$probe_root/AuthenticationCurl/lib" -lcurl -lmbedtls -lmbedx509 -lmbedcrypto \
            -o "$probe_root/native-auth-probe"
          "$probe_root/native-auth-probe" "$probe_root/Resources/SAPAssets" "$probe_root/AuthenticationCurl/cacert.pem"
